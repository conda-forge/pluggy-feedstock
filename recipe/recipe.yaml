schema_version: 1

context:
  name: pluggy
  version: "1.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pluggy-${{ version }}.tar.gz
  sha256: d1eaa46ebb595891b860ab086b4d09c8588af65ebd4361b8e8f4bb8920b90ba8

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=65.0
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - pluggy
      pip_check: true

about:
  homepage: https://github.com/pytest-dev/pluggy
  license: MIT
  license_file: LICENSE
  summary: Plugin registration and hook calling for Python
  documentation: https://pluggy.readthedocs.io/en/latest/
  repository: https://github.com/pytest-dev/pluggy/

extra:
  recipe-maintainers:
    - johnnygenomics
    - nicoddemus
    - adriendelsalle
